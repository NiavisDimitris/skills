<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<style>
  body { margin: 0; font: 16px/1.5 Arial, Helvetica, sans-serif; background: #f4f5f7; }
  form { width: 320px; margin: 80px auto; padding: 24px; background: #ffffff; }
  label, input, button { display: block; width: 100%; margin-bottom: 12px; }
</style>
</head>
<body>
<form method="post" action="/session">
  <h1>Sign in to Acme</h1>
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="username">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password">
  <button type="submit">Sign in</button>
  <a href="/forgot">Forgot your password?</a>
</form>
</body>
</html>
