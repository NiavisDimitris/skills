  /* ===== 16. Tabs, deep links (#finding=DQ-003, #state=empty, #tab=findings), keyboard, print ===== */

  if (!document.title || document.title.indexOf(PH + 'TITLE__') !== -1) document.title = 'Design QA — ' + (meta.feature || 'report');
  TABS.forEach(function (t) {
    tabBtns[t[0]] = h('button', { type: 'button', role: 'tab', class: 'tabs-trigger', id: 'tab-' + t[0], 'aria-controls': 'panel-' + t[0], 'aria-selected': 'false', tabindex: '-1', onclick: function () { setTab(t[0]); } },
