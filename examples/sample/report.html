  /* ===== 16. Tabs, deep links (#finding=DQ-003, #state=empty, #tab=findings), keyboard, print ===== */
  var TABS = [['overview', 'Overview', null], ['findings', 'Findings', findings.length], ['states', 'States', null], ['decisions', 'Decisions', null], ['evidence', 'Evidence', null]];

  TABS.forEach(function (t) {
    tabBtns[t[0]] = h('button', { type: 'button', role: 'tab', class: 'tabs-trigger', id: 'tab-' + t[0], 'aria-controls': 'panel-' + t[0], 'aria-selected': 'false', tabindex: '-1', onclick: function () { setTab(t[0]); } },
      t[1], t[2] === null ? null : h('span', { class: 'muted tabular', style: 'font-weight:400' }, String(t[2])));
