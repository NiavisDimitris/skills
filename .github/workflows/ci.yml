# CI for this repo (design-qa-skill itself): runs the test suite, validates
# the sample report, template rendering and the plugin and marketplace
# manifests, and blocks accidental proprietary content from landing anywhere
# in the repository.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request runs only; every push to main runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor: package.json "engines" requires >=20 (Playwright
        # 1.63 needs it). Node 20 reached end of life on 2026-04-30; it stays
        # here as long as "engines" allows it. 22 and 24 (the current LTS)
        # catch newer-runtime regressions.
        node-version: [20, 22, 24]
    steps:
      # Third-party actions are pinned to full commit SHAs (the tag is in the
      # comment): a tag can be moved, a SHA can't.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        # npx --no runs the playwright the lockfile installed and never
        # fetches another one.
        run: npx --no playwright install --with-deps chromium

      - name: The plugin installs from its own lockfile
        # What Claude Code runs on plugin install: the skill folder's package.json
        # and package-lock.json, registry packages only, no install scripts.
        working-directory: skills/design-qa
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/doctor.mjs

      - name: Run tests
        run: npm test

      - name: Validate the sample report against the schema
        run: node skills/design-qa/scripts/validate.mjs examples/sample/sample-report.json

      - name: Render the sample report and fix plan
        run: |
          node skills/design-qa/scripts/render-report.mjs \
            --in examples/sample/sample-report.json \
            --out /tmp/report.html \
            --embed-images \
            --fixplan /tmp/fixplan.md

      - name: Validate the plugin and marketplace manifests
        # claude plugin validate is a local check: no API key or login. Claude
        # Code needs Node 22 or later, so it runs on one leg. Pinned to an
        # exact version; bump it deliberately.
        if: matrix.node-version == 24
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.289
          claude plugin validate --strict .
          claude plugin validate --strict skills/design-qa

      - name: No proprietary content in the repository
        # Denylist of internal codenames, paths and identifiers that must
        # never appear in this public repo. The pattern (a grep -E regex)
        # lives in the DENYLIST repository secret, not in this file, so the
        # check doesn't publish the terms it guards. The whole checkout
        # is scanned (except .git and node_modules); only file names are printed.
        # Skipped when the secret isn't available (e.g. fork PRs).
        # If this fails, you (probably) pasted something from a private
        # codebase - scrub it, don't trim the list to make it pass.
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
        run: |
          if [ -z "$DENYLIST" ]; then
            echo "DENYLIST secret not set - skipping."
            exit 0
          fi
          # grep exits 0 on a match, 1 on no match, 2 on an error (e.g. a bad regex).
          status=0
          grep -rEIil "$DENYLIST" . --exclude-dir=.git --exclude-dir=node_modules || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::The files above match the DENYLIST secret, likely proprietary content. Remove it before merging."
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "::error::The denylist check failed (grep exit $status). Check the DENYLIST secret is a valid grep -E regex."
            exit 1
          fi
          echo "Clean - no denylisted strings in the repository."

      - name: Upload rendered sample report
        if: matrix.node-version == 20
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sample-report-html
          path: /tmp/report.html
